<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>EsnovaBeton — Web Sitemiz Hazırlanıyor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: #0F1117;
      color: #F3F4F6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 4rem 1.5rem;
      text-align: center;
    }

    .brand-header {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #FFFFFF;
      text-transform: uppercase;
    }

    .content-box {
      max-width: 550px;
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }

    .badge {
      display: inline-block;
      padding: 0.35rem 0.9rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 500;
      color: #9CA3AF;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .main-title {
      font-size: 2.5rem;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.2;
    }

    .description {
      font-size: 1.1rem;
      color: #9CA3AF;
      line-height: 1.6;
      font-weight: 300;
    }

    .email-link {
      margin-top: 0.75rem;
      font-size: 0.95rem;
      color: #E5E7EB;
      text-decoration: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.25);
      padding-bottom: 2px;
      transition: border-color 0.2s;
    }

    .email-link:hover {
      border-color: #FFFFFF;
    }

    footer {
      font-size: 0.8rem;
      color: #4B5563;
      font-weight: 300;
    }

    @media (max-width: 640px) {
      .main-title { font-size: 1.8rem; }
      .description { font-size: 0.95rem; }
    }
  </style>
</head>
<body>

  <div class="brand-header">
    EsnovaBeton
  </div>

  <div class="content-box">
    <div class="badge">YAKINDA HİZMETİNİZDE</div>
    <h1 class="main-title">Web Sitemiz Hazırlanıyor</h1>
    <p class="description">
      Geleceğin sağlam temelleri için dijital platformumuz çok yakında yayında olacaktır.
    </p>
    <a href="mailto:info@esnovabeton.com" class="email-link">info@esnovabeton.com</a>
  </div>

  <footer>
    &copy; 2026 EsnovaBeton. Tüm Hakları Saklıdır.
  </footer>

</body>
</html>
